# 1. Hệ thống và thứ tự khởi động
# Gồm PostgreSQL local, job migration/seed và API NestJS; cấu hình lấy từ api/.env.
# PostgreSQL healthy → migration và seed thành công → API; API_HOST_PORT:PORT và DB_HOST_PORT:DB_PORT.
# Host port chỉ bind vào 127.0.0.1; `docker compose down` giữ database và file DOCX đầu ra.
name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in api/.env}

services:
    postgres:
        # Service: PostgreSQL 17 local; Port: DB_HOST_PORT trên host → DB_PORT trong container.
        # Vai trò: lưu schema và dữ liệu trong volume riêng để tồn tại qua lần recreate.
        # Kết nối: API và migrate dùng DNS service `postgres`; job migrate chờ health check.
        container_name: ${POSTGRES_CONTAINER_NAME:?Set POSTGRES_CONTAINER_NAME in api/.env}
        image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in api/.env}
        restart: unless-stopped
        command: ['postgres', '-p', '${DB_PORT:?Set DB_PORT in api/.env}']
        environment:
            POSTGRES_DB: ${DB_NAME:?Set DB_NAME in api/.env}
            POSTGRES_USER: ${DB_USER:?Set DB_USER in api/.env}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in api/.env}
            DB_PORT: ${DB_PORT:?Set DB_PORT in api/.env}
        ports:
            - '${CONTAINER_BIND_ADDRESS:?Set CONTAINER_BIND_ADDRESS in api/.env}:${DB_HOST_PORT:?Set DB_HOST_PORT in api/.env}:${DB_PORT:?Set DB_PORT in api/.env}'
        volumes:
            - office-template-api-postgres-data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -p "$$DB_PORT" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
                ]
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 10s
        networks:
            - office-template-platform-network

    migrate:
        # Service: job một lần; Port: không publish ra host hoặc network.
        # Vai trò: áp dụng migration, seed 5 mẫu DOCX mới và dọn bộ demo cũ trước khi API khởi động.
        # Kết nối: PostgreSQL qua DNS service `postgres`; chỉ chạy sau health check.
        container_name: ${MIGRATE_CONTAINER_NAME:?Set MIGRATE_CONTAINER_NAME in api/.env}
        image: ${API_IMAGE:?Set API_IMAGE in api/.env}
        init: true
        restart: 'no'
        environment:
            NODE_ENV: ${API_NODE_ENV:?Set API_NODE_ENV in api/.env}
            DB_HOST: ${DB_HOST_DOCKER:?Set DB_HOST_DOCKER in api/.env}
            DB_PORT: ${DB_PORT:?Set DB_PORT in api/.env}
            DB_USER: ${DB_USER:?Set DB_USER in api/.env}
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in api/.env}
            DB_NAME: ${DB_NAME:?Set DB_NAME in api/.env}
            DB_SSL: ${DB_SSL:?Set DB_SSL in api/.env}
            DB_LOGGING: ${DB_LOGGING:?Set DB_LOGGING in api/.env}
        command:
            - sh
            - -c
            - >-
                node ./node_modules/typeorm/cli.js migration:run -d dist/database/config/data-source.js
                && node dist/database/seeds/document-template-samples.seed.js
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - office-template-platform-network

    api:
        # Service: NestJS HTTP API; Port: API_HOST_PORT trên host → PORT trong container.
        # Vai trò: phục vụ thư viện mẫu DOCX; health check gọi /api/health.
        # Kết nối: PostgreSQL qua DNS `postgres`; dữ liệu DOCX đầu ra ở named volume riêng.
        container_name: ${API_CONTAINER_NAME:?Set API_CONTAINER_NAME in api/.env}
        image: ${API_IMAGE:?Set API_IMAGE in api/.env}
        build:
            context: .
            dockerfile: Dockerfile
            target: runtime
        init: true
        restart: unless-stopped
        environment:
            NODE_ENV: ${API_NODE_ENV:?Set API_NODE_ENV in api/.env}
            PORT: ${PORT:?Set PORT in api/.env}
            WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN in api/.env}
            FILE_STORAGE_ROOT: ${FILE_STORAGE_ROOT_DOCKER:?Set FILE_STORAGE_ROOT_DOCKER in api/.env}
            DB_HOST: ${DB_HOST_DOCKER:?Set DB_HOST_DOCKER in api/.env}
            DB_PORT: ${DB_PORT:?Set DB_PORT in api/.env}
            DB_USER: ${DB_USER:?Set DB_USER in api/.env}
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in api/.env}
            DB_NAME: ${DB_NAME:?Set DB_NAME in api/.env}
            DB_SSL: ${DB_SSL:?Set DB_SSL in api/.env}
            DB_LOGGING: ${DB_LOGGING:?Set DB_LOGGING in api/.env}
        ports:
            - '${CONTAINER_BIND_ADDRESS:?Set CONTAINER_BIND_ADDRESS in api/.env}:${API_HOST_PORT:?Set API_HOST_PORT in api/.env}:${PORT:?Set PORT in api/.env}'
        volumes:
            - office-template-api-file-storage:/app/storage
        depends_on:
            migrate:
                condition: service_completed_successfully
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:${PORT:?Set PORT in api/.env}/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 20s
        stop_grace_period: 20s
        networks:
            - office-template-platform-network

volumes:
    office-template-api-postgres-data:
        name: ${DB_VOLUME_NAME:?Set DB_VOLUME_NAME in api/.env}
        # Volume external giúp project mới gắn lại đúng database local đang có.
        external: true
    office-template-api-file-storage:
        name: ${FILE_STORAGE_VOLUME_NAME:?Set FILE_STORAGE_VOLUME_NAME in api/.env}
        # Giữ file DOCX người dùng tạo qua lần recreate hoặc cập nhật API container.

networks:
    office-template-platform-network:
        name: ${COMPOSE_NETWORK_NAME:?Set COMPOSE_NETWORK_NAME in api/.env}
        # Network riêng để API và migration phân giải PostgreSQL bằng tên service.
        driver: bridge
