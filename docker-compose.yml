# Hệ thống và thứ tự khởi động
# Gồm PostgreSQL local, job migration/seed và API NestJS; cấu hình lấy từ api/.env.
# PostgreSQL healthy → migration và seed thành công → API; API_HOST_PORT:PORT và DB_HOST_PORT:DB_PORT.
# Host port chỉ bind vào 127.0.0.1; `docker compose down` giữ database và file DOCX/PPTX đầu ra.
name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in api/.env}

services:
    postgres:
        # Service: PostgreSQL 17 local; Port: DB_HOST_PORT trên host → DB_PORT trong container.
        # Vai trò: lưu schema và dữ liệu trong volume riêng để tồn tại qua lần recreate.
        # Kết nối: API và migrate dùng DNS service `postgres`; job migrate chờ health check.
        container_name: ${POSTGRES_CONTAINER_NAME:?Set POSTGRES_CONTAINER_NAME in api/.env}
        image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in api/.env}
        restart: unless-stopped
        command: ['postgres', '-p', '${DB_PORT:?Set DB_PORT in api/.env}']
        environment:
            POSTGRES_DB: ${DB_NAME:?Set DB_NAME in api/.env}
            POSTGRES_USER: ${DB_USER:?Set DB_USER in api/.env}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in api/.env}
            DB_PORT: ${DB_PORT:?Set DB_PORT in api/.env}
        ports:
            - '${CONTAINER_BIND_ADDRESS:?Set CONTAINER_BIND_ADDRESS in api/.env}:${DB_HOST_PORT:?Set DB_HOST_PORT in api/.env}:${DB_PORT:?Set DB_PORT in api/.env}'
        volumes:
            - office-template-api-postgres-data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -p "$$DB_PORT" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
                ]
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 10s
        networks:
            - office-template-platform-network

    migrate:
        # Service: job một lần; Port: không publish ra host hoặc network.
        # Vai trò: áp dụng migration và seed catalog DOCX/PPTX trước khi API khởi động.
        # Kết nối: PostgreSQL qua DNS service `postgres`; chỉ chạy sau health check.
        container_name: ${MIGRATE_CONTAINER_NAME:?Set MIGRATE_CONTAINER_NAME in api/.env}
        image: ${API_IMAGE:?Set API_IMAGE in api/.env}
        init: true
        restart: 'no'
        environment:
            NODE_ENV: ${API_NODE_ENV:?Set API_NODE_ENV in api/.env}
            DB_HOST: ${DB_HOST_DOCKER:?Set DB_HOST_DOCKER in api/.env}
            DB_PORT: ${DB_PORT:?Set DB_PORT in api/.env}
            DB_USER: ${DB_USER:?Set DB_USER in api/.env}
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in api/.env}
            DB_NAME: ${DB_NAME:?Set DB_NAME in api/.env}
            DB_SSL: ${DB_SSL:?Set DB_SSL in api/.env}
            DB_LOGGING: ${DB_LOGGING:?Set DB_LOGGING in api/.env}
        command:
            - sh
            - -c
            - >-
                node ./node_modules/typeorm/cli.js migration:run -d dist/database/config/data-source.js
                && node dist/database/seeds/office-template-samples.seed.js
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - office-template-platform-network

    api:
        # Service: NestJS HTTP API; Port: API_HOST_PORT trên host → PORT trong container.
        # Vai trò: phục vụ thư viện mẫu DOCX/PPTX; health check gọi /api/health.
        # Kết nối: PostgreSQL qua DNS `postgres`; file tài liệu đầu ra ở named volume riêng.
        container_name: ${API_CONTAINER_NAME:?Set API_CONTAINER_NAME in api/.env}
        image: ${API_IMAGE:?Set API_IMAGE in api/.env}
        build:
            context: .
            dockerfile: Dockerfile
            target: runtime
        init: true
        restart: unless-stopped
        environment:
            NODE_ENV: ${API_NODE_ENV:?Set API_NODE_ENV in api/.env}
            PORT: ${PORT:?Set PORT in api/.env}
            WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN in api/.env}
            FILE_STORAGE_ROOT: ${FILE_STORAGE_ROOT_DOCKER:?Set FILE_STORAGE_ROOT_DOCKER in api/.env}
            DB_HOST: ${DB_HOST_DOCKER:?Set DB_HOST_DOCKER in api/.env}
            DB_PORT: ${DB_PORT:?Set DB_PORT in api/.env}
            DB_USER: ${DB_USER:?Set DB_USER in api/.env}
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in api/.env}
            DB_NAME: ${DB_NAME:?Set DB_NAME in api/.env}
            DB_SSL: ${DB_SSL:?Set DB_SSL in api/.env}
            DB_LOGGING: ${DB_LOGGING:?Set DB_LOGGING in api/.env}
            ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:?Set ONLYOFFICE_PUBLIC_URL in api/.env}
            ONLYOFFICE_INTERNAL_URL: ${ONLYOFFICE_INTERNAL_URL_DOCKER:?Set ONLYOFFICE_INTERNAL_URL_DOCKER in api/.env}
            ONLYOFFICE_API_INTERNAL_URL: ${ONLYOFFICE_API_INTERNAL_URL_DOCKER:?Set ONLYOFFICE_API_INTERNAL_URL_DOCKER in api/.env}
            ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Set ONLYOFFICE_JWT_SECRET in api/.env}
        ports:
            - '${CONTAINER_BIND_ADDRESS:?Set CONTAINER_BIND_ADDRESS in api/.env}:${API_HOST_PORT:?Set API_HOST_PORT in api/.env}:${PORT:?Set PORT in api/.env}'
        volumes:
            - office-template-api-file-storage:/app/storage
        depends_on:
            migrate:
                condition: service_completed_successfully
            onlyoffice:
                # Chỉ khởi động API sau khi Docs Server phản hồi healthcheck trên cổng nội bộ 80.
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:${PORT:?Set PORT in api/.env}/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 20s
        stop_grace_period: 20s
        networks:
            - office-template-platform-network

    onlyoffice:
        # Service: ONLYOFFICE Docs Community; Port: ONLYOFFICE_HOST_PORT trên host → HTTP 80 trong container.
        # Vai trò: chạy editor DOCX và cung cấp callback lưu; JWT bắt buộc cho cấu hình và request backend.
        # Kết nối: API callback/file dùng DNS `api`; trình duyệt tải editor script qua ONLYOFFICE_PUBLIC_URL.
        container_name: ${ONLYOFFICE_CONTAINER_NAME:?Set ONLYOFFICE_CONTAINER_NAME in api/.env}
        image: ${ONLYOFFICE_IMAGE:?Set ONLYOFFICE_IMAGE in api/.env}
        restart: unless-stopped
        environment:
            JWT_ENABLED: 'true'
            JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Set ONLYOFFICE_JWT_SECRET in api/.env}
            JWT_HEADER: Authorization
            ALLOW_PRIVATE_IP_ADDRESS: 'true'
        ports:
            - '${CONTAINER_BIND_ADDRESS:?Set CONTAINER_BIND_ADDRESS in api/.env}:${ONLYOFFICE_HOST_PORT:?Set ONLYOFFICE_HOST_PORT in api/.env}:80'
        volumes:
            - office-template-onlyoffice-logs:/var/log/onlyoffice
            - office-template-onlyoffice-data:/var/www/onlyoffice/Data
            - office-template-onlyoffice-lib:/var/lib/onlyoffice
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'curl -fsS http://localhost/healthcheck || exit 1',
                ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 120s
        networks:
            - office-template-platform-network

volumes:
    office-template-api-postgres-data:
        name: ${DB_VOLUME_NAME:?Set DB_VOLUME_NAME in api/.env}
        # Volume external giúp project mới gắn lại đúng database local đang có.
        external: true
    office-template-api-file-storage:
        name: ${FILE_STORAGE_VOLUME_NAME:?Set FILE_STORAGE_VOLUME_NAME in api/.env}
        # Giữ file DOCX/PPTX người dùng tạo qua lần recreate hoặc cập nhật API container.
    office-template-onlyoffice-logs:
        # Lưu log Docs Server qua lần recreate để tiện xem lỗi editor/callback.
    office-template-onlyoffice-data:
        # Lưu certificate và dữ liệu runtime của ONLYOFFICE Docs.
    office-template-onlyoffice-lib:
        # Lưu dữ liệu dịch vụ Docs Server cần tồn tại khi container được cập nhật.

networks:
    office-template-platform-network:
        name: ${COMPOSE_NETWORK_NAME:?Set COMPOSE_NETWORK_NAME in api/.env}
        # Network riêng để API và migration phân giải PostgreSQL bằng tên service.
        driver: bridge
